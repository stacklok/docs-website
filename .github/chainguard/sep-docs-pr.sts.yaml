# Only SEP's reference publisher on main can mint a token for this repo.
# OctoSTS reads policies from the default branch. Install stacklok-octosts
# on docs-website; the main ruleset requires reviewed PRs for publication.
issuer: https://token.actions.githubusercontent.com
subject: repo:stacklok/stacklok-enterprise-platform:ref:refs/heads/main

# workflow_ref identifies the standalone workflow, including its branch.
# OctoSTS anchors the expression to the entire claim value.
claim_pattern:
  repository_id: '1173448377'
  repository_owner_id: '110237746'
  workflow_ref: stacklok/stacklok-enterprise-platform/\.github/workflows/publish-docs-references\.yml@refs/heads/main

# The deployed OctoSTS service has only GITHUB_APP_IDS=4886385 configured.
# Its policy parser does not support app pins. Upgrade the service before
# adding app: "4886385", and add that pin before configuring a second App.
# The publisher uses sep/references-* branches; branch scoping is enforced
# by the workflow, not by the installation token.
permissions:
  contents: write
  pull_requests: write
