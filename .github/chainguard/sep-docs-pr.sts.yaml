# OctoSTS trust policy. It lets one reusable workflow in
# stacklok/stacklok-enterprise-platform push branches and open PRs here.
# OctoSTS reads this file from the default branch only.
issuer: https://token.actions.githubusercontent.com

# The stacklok org uses immutable OIDC subjects: owner@<org-id>/repo@<repo-id>.
# Only runs on SEP `main` match.
subject: repo:stacklok@110237746/stacklok-enterprise-platform@1173448377:ref:refs/heads/main

# Only the SEP reusable workflow below gets a token. Other SEP workflows on
# main must call it. OctoSTS anchors every pattern with ^ and $.
claim_pattern:
  job_workflow_ref: stacklok/stacklok-enterprise-platform/\.github/workflows/_docs-website-pr\.yml@refs/heads/main

# The `main` ruleset still blocks direct pushes to main.
permissions:
  contents: write
  pull_requests: write
