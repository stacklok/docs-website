# Only the reviewed main-branch workflow can exchange tokens.
# Publication branches are restricted by workflow validation and repo rulesets.
issuer: https://token.actions.githubusercontent.com
subject: repo:stacklok/docs-website:ref:refs/heads/main
claim_pattern:
  repository_id: '997038133'
  repository_owner_id: '110237746'
  workflow_ref: stacklok/docs-website/\.github/workflows/upstream-release-docs\.yml@refs/heads/main
  event_name: workflow_dispatch
app: '4886385'
permissions:
  actions: read
  contents: write
  pull_requests: write
