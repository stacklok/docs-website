name: Visual regression

on:
  workflow_call:

permissions:
  contents: read

jobs:
  visual-regression:
    name: Playwright visual snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned to the exact @playwright/test version in package.json — the
    # image and npm package must match exactly, or browser launch breaks.
    # Screenshot comparison is sensitive to font rendering and software
    # rasterization, which differ by host OS/GPU — running inside this
    # exact image keeps this job and the /update-snapshots regeneration
    # job (update-visual-baselines.yaml, same digest) pixel-consistent
    # with each other regardless of which runner picks up the job.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --ipc=host
    env:
      # Keep in sync with the image tag in the comment above — the
      # "Verify Playwright version" step below checks the installed
      # @playwright/test against this, so a dependency bump without a
      # matching image bump fails loud and named instead of as a
      # confusing browser-launch error on an unrelated PR.
      PLAYWRIGHT_IMAGE_VERSION: '1.63.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actions/checkout marks the repo safe in the RUNNER's git config,
      # but a run: step inside `container:` executes via `docker exec`
      # into a separate environment that never got that exception —
      # without this, Docusaurus's last-update-date git log call (and
      # anything else here shelling out to git) fails with "detected
      # dubious ownership in repository".
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The Playwright image is minimal — it ships neither jq, which
      # scripts/install-thv.sh requires, nor a Node version manager, since
      # it already bundles the Node build this image's Chromium was
      # tested against. A pinned static binary (checksum-verified) avoids
      # `apt-get update`, which syncs the full Ubuntu archive index just
      # to install one small tool.
      - name: Install jq
        run: |
          curl -sSL -o /usr/local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
          echo "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  /usr/local/bin/jq" | sha256sum -c -
          chmod +x /usr/local/bin/jq

      - name: Cache dependencies
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify Playwright version matches pinned image
        run: |
          installed="$(npx playwright --version | sed -n 's/^Version \([0-9.]*\)$/\1/p')"
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test resolved to $installed but the pinned image is for $PLAYWRIGHT_IMAGE_VERSION — bump the image digest (see container.image comment) to match."
            exit 1
          fi

      - name: Install ToolHive CLI
        run: ./scripts/install-thv.sh

      - name: Build site
        run: npm run build

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Only reachable on a genuine pull_request run (workflow_call inherits
  # the caller's github.event — see on-pr.yaml — so this is still the
  # real PR payload, not something workflow_call replaces). Guards
  # against this reusable workflow ever being called from a different
  # trigger in the future, where none of the PR-specific outputs below
  # would exist.
  check-auto-fix-eligibility:
    name: Check auto-fix eligibility
    needs: visual-regression
    if: always() && needs.visual-regression.result == 'failure' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # The PR's own head commit, not the default pull_request merge ref
      # — this is checking what's actually ON the branch (was its last
      # commit already an auto-fix?), which the merge commit itself
      # never carries as its own message/author.
      - name: Checkout PR head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check eligibility
        id: check
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          author="$(git log -1 --format='%an <%ae>')"
          subject="$(git log -1 --format=%s)"
          if [ "$author" = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" ] \
            && [[ "$subject" == "chore: update visual baselines for"* ]]; then
            # Deliberately not attempting another auto-commit on top of a
            # bot commit — that risks chaining fixups indefinitely on a
            # failure that regenerating baselines can never fix (a real
            # regression, or main having moved again since).
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=chained" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=ok" >> "$GITHUB_OUTPUT"

  auto-fix:
    name: Auto-update baselines on failure
    needs: [visual-regression, check-auto-fix-eligibility]
    # always(): needed because one of this job's own `needs`
    # (visual-regression) failed — without it, GitHub's implicit
    # "every dependency must succeed" gate skips this job regardless of
    # the eligible check below.
    if: always() && needs.check-auto-fix-eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    outputs:
      updated: ${{ steps.regen.outputs.updated }}
    # Same pinned image as the check above and update-visual-baselines.yaml,
    # for the same reason: byte-exact pixel comparison needs the exact
    # browser build the committed baselines were generated against.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --ipc=host
    steps:
      # Deliberately no ref: override — this inherits the same
      # pull_request default (the merge commit) that the failing check
      # above just tested, so regeneration happens against the exact
      # tree that failed, not a possibly-stale branch tip. See
      # update-visual-baselines.sh for how it gets pushed back onto the
      # real branch from there.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install jq
        run: |
          curl -sSL -o /usr/local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
          echo "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  /usr/local/bin/jq" | sha256sum -c -
          chmod +x /usr/local/bin/jq

      - name: Install dependencies
        run: npm ci

      - name: Install ToolHive CLI
        run: ./scripts/install-thv.sh

      - name: Build site
        run: npm run build

      - name: Regenerate and push baselines
        id: regen
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/update-visual-baselines.sh "${HEAD_REF}" "${HEAD_SHA}"

  notify:
    name: Comment auto-fix outcome
    needs: [visual-regression, check-auto-fix-eligibility, auto-fix]
    if: always() && needs.visual-regression.result == 'failure' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment outcome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ needs.check-auto-fix-eligibility.outputs.reason }}
          AUTO_FIX_RESULT: ${{ needs.auto-fix.result }}
          UPDATED: ${{ needs.auto-fix.outputs.updated }}
        run: |
          if [ "$REASON" = "fork" ]; then
            BODY="⚠️ Visual regression failed on a fork PR — baseline auto-fix isn't available here (GitHub withholds write secrets from fork \`pull_request\` runs). Regenerate locally instead: \`npm run test:visual:update\`, then commit and push the changed files under \`tests/visual/*.spec.ts-snapshots/\`."
          elif [ "$REASON" = "chained" ]; then
            BODY="❌ Still failing after a previous baseline update. Deliberately not attempting another auto-commit on top of a bot commit — this needs a human look: check whether this is a real regression, or whether \`main\` has moved again since the last update (rebase and see if that resolves it)."
          elif [ "$AUTO_FIX_RESULT" = "success" ] && [ "$UPDATED" = "true" ]; then
            BODY="📸 Visual regression failed, so I regenerated and pushed updated baselines. **Review the diff before trusting it** — see the screenshot summary below (added by the PR Screenshot Summary workflow) once it lands. This only proves the render is *consistent*, not that it's *correct*."
          else
            BODY="❌ No baseline auto-fix could be pushed. Either regenerating reproduced no diff (consistent with a real, non-snapshot failure — no baseline change will fix that) or the auto-fix step itself failed. See the failing-tests list in the Visual regression job for what actually broke."
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --edit-last --create-if-none --body "$BODY"
