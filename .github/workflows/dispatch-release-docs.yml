name: Dispatch release docs

# Execute no PR code. Dispatch the reviewed main-branch publisher so its
# OctoSTS policy never needs to trust a PR-supplied workflow definition.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened]
    branches: [main]
    paths:
      - '.github/upstream-projects.yaml'

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch trusted release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run upstream-release-docs.yml --repo "$GITHUB_REPOSITORY" \
            --ref main --field "pr_number=$PR_NUMBER"
