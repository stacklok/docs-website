name: Enterprise Docs Slack Notify

# SEP applies autogen-docs when its validated reference sync is ready.
# Its OctoSTS installation token emits PR events across repositories.
# Run trusted main-branch code only; never check out the generated PR.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Enterprise sync PR number to notify about (manual retry)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.user.login == 'stacklok-octosts[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main' &&
       startsWith(github.event.pull_request.head.ref, 'sep/references-') &&
       !github.event.pull_request.draft &&
       contains(github.event.pull_request.labels.*.name, 'autogen-docs') &&
       (github.event.action == 'ready_for_review' || github.event.label.name == 'autogen-docs'))
    env:
      MESSAGE_FILE: ${{ github.workspace }}/.enterprise-docs-slack-message.json
    steps:
      - name: Checkout notification script from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve PR and compose notification
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json author,assignees,baseRefName,headRefName,isCrossRepository,isDraft,state,labels,url)
          if ! jq -e '
            (.author.login == "app/stacklok-octosts" or .author.login == "stacklok-octosts[bot]") and
            .baseRefName == "main" and (.isCrossRepository | not) and
            (.headRefName | startswith("sep/references-")) and
            (.isDraft | not) and .state == "OPEN" and
            any(.labels[]; .name == "autogen-docs")
          ' <<< "$PR_JSON" > /dev/null; then
            echo "PR #$PR_NUMBER is not a ready, labeled SEP reference sync; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_URL=$(jq -r '.url' <<< "$PR_JSON")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          jq '{
            headline: ("Stacklok Enterprise " + (.headRefName | ltrimstr("sep/references-") |
              gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")) + " references"),
            summary_bullets: [
              "Auto-generated API specifications, CRD references, and Helm values refreshed",
              "Generated references validated and production docs build passed in SEP"
            ],
            reference_only: true,
            owner: (.assignees[0] | if . then {login: .login} else null end),
            pr_url: .url
          }' <<< "$PR_JSON" > "$MESSAGE_FILE"

      # Only the deterministic poster receives the Slack token.
      - name: Post summary to Slack
        if: steps.pr.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DOCS_SLACK_CHANNEL_ID: C06SZA9HBHU
          PR_URL: ${{ steps.pr.outputs.url }}
        run: python3 .github/scripts/post_autogen_docs_slack.py
