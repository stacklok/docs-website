name: On PR

on:
  pull_request:

permissions:
  contents: read

# Cancel stale runs so only the PR's current HEAD determines the
# check status. Matters specifically for PRs where the
# upstream-release-docs workflow pushes multiple commits
# in quick succession (skill output + prettier/eslint autofix): the
# intermediate commits briefly fail lint until the autofix lands,
# and without cancel-in-progress those intermediate failures stay
# in the check history.
concurrency:
  group: on-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    uses: $/.github/workflows/_static-checks.yaml

  visual-regression:
    name: Visual regression
    # contents: write and pull-requests: write are for the reusable
    # workflow's own auto-fix/notify jobs (baseline auto-update on
    # failure, PR comment) — the visual-regression check job itself only
    # ever reads. A called reusable workflow's jobs can't request more
    # than what the caller job grants here.
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_visual-regression.yaml
