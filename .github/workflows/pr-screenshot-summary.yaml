name: PR Screenshot Summary

on:
  pull_request:
    # `edited` (title/body/base changed) makes this self-healing: if a
    # human or agent overwrites the whole PR body and wipes the fenced
    # section, the next body edit regenerates it. Safe by construction
    # against a rewrite loop — this job's own `gh pr edit` runs on
    # GITHUB_TOKEN, and GitHub Actions never lets a GITHUB_TOKEN write
    # re-trigger a workflow, only a real actor's own token does.
    types: [opened, synchronize, edited]
    paths:
      - 'tests/visual/**'
  # Manual escape hatch — e.g. to (re)generate the summary on a PR that
  # already has the snapshot changes but hasn't had a new push since this
  # workflow was added.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to update'
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-description:
    name: Update PR description with screenshot summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request events already carry number/base/head in the event
      # payload; workflow_dispatch only has the pr_number input, so look
      # the rest up via the API — one source of truth for both triggers
      # from here on.
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -n "$EVENT_PR_NUMBER" ]; then
            {
              echo "number=$EVENT_PR_NUMBER"
              echo "base_ref=$EVENT_BASE_REF"
              echo "head_sha=$EVENT_HEAD_SHA"
            } >> "$GITHUB_OUTPUT"
          else
            PR_NUMBER="$DISPATCH_PR_NUMBER"
            BASE_REF="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName -q .baseRefName)"
            HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)"
            {
              echo "number=$PR_NUMBER"
              echo "base_ref=$BASE_REF"
              echo "head_sha=$HEAD_SHA"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # scripts/pr-screenshot-summary.mjs diffs against origin/<base ref>.
      # fetch-depth: 0 above pulls full history for the checked-out PR
      # head commit, but actions/checkout's fetch refspec doesn't
      # necessarily update refs/remotes/origin/* for other branches — the
      # explicit destination refspec here guarantees origin/<base ref>
      # resolves regardless of trigger type.
      - name: Fetch base ref
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: git fetch origin "+$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Update PR description with screenshot summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node scripts/update-pr-screenshot-summary.mjs
