name: PR Screenshot Summary

# workflow_run always loads this workflow from the default branch. That makes
# it a trusted follow-up to the read-only PR workflow even though this job can
# update pull request descriptions.
# The privileged job checks out only the API-resolved base SHA and treats the
# PR head as inert Git data. Zizmor cannot infer that cross-step trust boundary.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['On PR']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-description:
    name: Update PR description with screenshot summary
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Resolve current PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_JSON="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          BASE_SHA="$(echo "$PR_JSON" | jq -r '.base.sha')"
          HEAD_SHA="$(echo "$PR_JSON" | jq -r '.head.sha')"
          if [ "$HEAD_SHA" != "$RUN_HEAD_SHA" ]; then
            echo "The PR advanced after this run; its newer run will update the summary."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "current=true"
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout trusted base revision
        if: steps.pr.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head for read-only inspection
        if: steps.pr.outputs.current == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          git fetch --no-tags origin \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER/head"
          ACTUAL_HEAD_SHA="$(git rev-parse "refs/remotes/origin/pr/$PR_NUMBER/head")"
          if [ "$ACTUAL_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR head changed while preparing the summary; retry against the current head."
            exit 1
          fi

      - name: Resolve visual regression job
        if: steps.pr.outputs.current == 'true'
        id: visual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          JOBS_FILE="$RUNNER_TEMP/jobs.json"
          ARTIFACTS_FILE="$RUNNER_TEMP/artifacts.json"
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > "$JOBS_FILE"
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" > "$ARTIFACTS_FILE"
          CONCLUSION="$(jq -r '[.jobs[] | select(.name == "Visual regression / Playwright visual snapshots")][0].conclusion // "missing"' "$JOBS_FILE")"
          JOB_URL="$(jq -r '[.jobs[] | select(.name == "Visual regression / Playwright visual snapshots")][0].html_url // ""' "$JOBS_FILE")"
          ARTIFACT_ID="$(jq -r '[.artifacts[] | select(.name == "playwright-report" and .expired == false)][0].id // ""' "$ARTIFACTS_FILE")"
          ARTIFACT_SIZE="$(jq -r '[.artifacts[] | select(.name == "playwright-report" and .expired == false)][0].size_in_bytes // "0"' "$ARTIFACTS_FILE")"
          {
            echo "conclusion=$CONCLUSION"
            echo "job_url=$JOB_URL"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_size=$ARTIFACT_SIZE"
          } >> "$GITHUB_OUTPUT"

      - name: Download failed visual regression report archive
        if: steps.pr.outputs.current == 'true' && steps.visual.outputs.conclusion == 'failure' && steps.visual.outputs.artifact_id != ''
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ steps.visual.outputs.artifact_id }}
          ARTIFACT_SIZE: ${{ steps.visual.outputs.artifact_size }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$ARTIFACT_SIZE" -gt 26214400 ]; then
            echo "::warning::Playwright artifact is larger than the 25 MiB download limit."
            exit 0
          fi
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/playwright-report.zip"

      - name: Update PR description with screenshot summary
        if: steps.pr.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        # This script comes from the checked-out base revision, never the PR.
        run: node scripts/update-pr-screenshot-summary.mjs

      - name: Update visual failure comment
        if: always() && steps.pr.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          VISUAL_CONCLUSION: ${{ steps.visual.outputs.conclusion }}
          VISUAL_JOB_URL: ${{ steps.visual.outputs.job_url }}
          ARTIFACT_PATH: ${{ runner.temp }}/playwright-report.zip
        # This script comes from the checked-out base revision, never the PR.
        run: python3 .github/scripts/update_visual_failure_comment.py
